# Builds the Nuxt site as static files and deploys it to GitHub Pages on every push to master.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['master']
  # Allows a manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels the running one
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24: Nuxt Content uses the built-in node:sqlite module
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # npm install, not npm ci: the lock file comes from macOS and lacks some Linux-only
      # optional packages (@emnapi/*), which makes npm ci refuse to run on the runner
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate static site
        run: npx nuxt generate

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
